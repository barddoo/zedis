name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Zig and OpenSSL
        run: |
          sudo apt-get install -y --no-install-recommends libssl-dev minisign
          ./install-zig.sh 0.17.1 "RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U"
          sudo ln -sf /usr/include/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/openssl/opensslconf.h \
            /usr/include/openssl/opensslconf.h

      - name: Run tests
        run: zig build test:all -Dopenssl-prefix=/usr

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            binary: zedis
            ext: ""
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            binary: zedis
            ext: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            -w /src \
            alpine:3.24.4 \
            sh -c 'apk add --no-cache curl xz openssl-dev openssl-libs-static minisign && ./install-zig.sh 0.17.1 "RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U" && zig build -Drelease -Dopenssl-static=true -Dopenssl-prefix=/usr -Dtarget=$(uname -m)-linux-musl'
          cp zig-out/bin/${{ matrix.binary }} zedis-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}${{ matrix.ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: zedis-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}
          path: zedis-${{ steps.version.outputs.VERSION }}-${{ matrix.platform }}${{ matrix.ext }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "VERSION=${TAG}" >> "$GITHUB_OUTPUT"
          echo "SEMVER=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Read CHANGELOG
        id: changelog
        uses: mindsers/changelog-reader-action@v2
        with:
          version: ${{ steps.version.outputs.SEMVER }}
          path: ./CHANGELOG.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move artifacts to root and generate checksums
        run: |
          mv artifacts/*/* .
          sha256sum zedis-${{ steps.version.outputs.VERSION }}-* > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            zedis-${{ steps.version.outputs.VERSION }}-linux-x86_64
            zedis-${{ steps.version.outputs.VERSION }}-linux-aarch64
            # zedis-${{ steps.version.outputs.VERSION }}-windows-x86_64.exe
            SHA256SUMS
          body: |
            ${{ steps.changelog.outputs.changes }}

            ---

            ## Install

            **Linux (x86_64)**
            ```bash
            curl -Lo zedis https://github.com/charlesfonseca/zedis/releases/download/${{ steps.version.outputs.VERSION }}/zedis-${{ steps.version.outputs.VERSION }}-linux-x86_64
            chmod +x zedis && sudo mv zedis /usr/local/bin/
            ```

            **Linux (ARM64)**
            ```bash
            curl -Lo zedis https://github.com/charlesfonseca/zedis/releases/download/${{ steps.version.outputs.VERSION }}/zedis-${{ steps.version.outputs.VERSION }}-linux-aarch64
            chmod +x zedis && sudo mv zedis /usr/local/bin/
            ```

            ### Verify checksums

            ```bash
            sha256sum -c SHA256SUMS
            ```

            ## Quick start

            ```bash
            # Start server (listens on 127.0.0.1:6379 by default)
            zedis

            # Connect
            redis-cli ping
            # PONG

            SET hello world
            GET hello
            # "world"
            ```
          draft: false
          prerelease: false
