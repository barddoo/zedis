name: Docker

on:
  push:
    tags:
      - '*.*.*'

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push per-arch images
        uses: docker/bake-action@v7
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          REGISTRY: ${{ secrets.DOCKERHUB_USERNAME }}/zedis
        with:
          push: true
          set: |
            *.platforms=${{ matrix.platform }}
            alpine.tags=${{ secrets.DOCKERHUB_USERNAME }}/zedis:${{ steps.version.outputs.VERSION }}-alpine-${{ matrix.arch }}
            debian.tags=${{ secrets.DOCKERHUB_USERNAME }}/zedis:${{ steps.version.outputs.VERSION }}-debian-${{ matrix.arch }}
            distroless.tags=${{ secrets.DOCKERHUB_USERNAME }}/zedis:${{ steps.version.outputs.VERSION }}-distroless-${{ matrix.arch }}

  merge:
    name: Merge manifests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create multi-arch manifests
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          REPO: ${{ secrets.DOCKERHUB_USERNAME }}/zedis
        run: |
          docker buildx imagetools create \
            --tag $REPO:$VERSION-alpine \
            --tag $REPO:alpine \
            $REPO:$VERSION-alpine-amd64 \
            $REPO:$VERSION-alpine-arm64

          docker buildx imagetools create \
            --tag $REPO:$VERSION-slim \
            --tag $REPO:$VERSION-debian \
            --tag $REPO:$VERSION \
            --tag $REPO:latest \
            $REPO:$VERSION-debian-amd64 \
            $REPO:$VERSION-debian-arm64

          docker buildx imagetools create \
            --tag $REPO:$VERSION-distroless \
            $REPO:$VERSION-distroless-amd64 \
            $REPO:$VERSION-distroless-arm64
